name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Install dependencies
        run: uv --directory amberclaw/backend sync --frozen --all-extras --dev

      - name: Code Quality & Type Checks (make check)
        run: make check

      - name: Run Tests (make test)
        run: make test

  test-install-paths:
    name: Test Install Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Test uv tool install
        run: |
          uv tool install ./amberclaw/backend
          amberclaw --help

      - name: Test pip install
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install ./amberclaw/backend
          amberclaw --help

  build-artifacts:
    name: Build package and container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0

      - name: Build Python distributions
        run: uv build amberclaw/backend --out-dir dist

      - name: Upload Python distributions
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Build container image without publishing
        run: docker build --tag amberclaw/ci:${{ github.sha }} --file deploy/docker/Dockerfile .

  security-audit:
    name: Security Scan & Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Install dependencies
        run: uv --directory amberclaw/backend sync --frozen --all-extras --dev

      - name: Run Bandit (Code Scanning)
        run: uv --directory amberclaw/backend run bandit -r src/ -lll

      - name: Secret scan (Gitleaks v8.30.1, redacted)
        env:
          GOBIN: ${{ runner.temp }}/amberclaw-tools
          GOSUMDB: sum.golang.org
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --config=amberclaw/scripts/.gitleaks.toml --redact=100 --no-banner -v

      - name: Verify No Unsafe Deserialization (Bandit B301, B302)
        run: uv --directory amberclaw/backend run bandit -r src/ -t B301,B302

      - name: Check installed public dependencies (pip-audit)
        continue-on-error: true
        run: |
          uv --directory amberclaw/backend pip freeze --exclude-editable > installed-public-requirements.txt
          uv --directory amberclaw/backend run pip-audit --requirement ../../installed-public-requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: License Policy Compliance Check
        run: uv --directory amberclaw/backend run python ../scripts/check_licenses.py

      - name: Entropy & Git History Secret Scan
        run: uv --directory amberclaw/backend run amberclaw scan-secrets --entropy --git-history

      - name: Generate CycloneDX and SPDX SBOMs
        run: uv --directory amberclaw/backend run python ../scripts/generate_sbom.py --out-dir ../../dist

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amberclaw-sboms
          path: dist/amberclaw.*.json
