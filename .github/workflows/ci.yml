name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981718e0 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1edb512832cc572a6b147611031914328fb043ae # v5.1.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Code Quality & Type Checks (make check)
        run: make check

      - name: Run Tests (make test)
        run: make test

  test-install-paths:
    name: Test Install Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981718e0 # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1edb512832cc572a6b147611031914328fb043ae # v5.1.0

      - name: Test uv tool install
        run: |
          uv tool install .
          amberclaw --help

      - name: Test pip install
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install .
          amberclaw --help
