name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Code Quality & Type Checks (make check)
        run: make check

      - name: Run Tests (make test)
        run: make test

  test-install-paths:
    name: Test Install Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Test uv tool install
        run: |
          uv tool install .
          amberclaw --help

      - name: Test pip install
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install .
          amberclaw --help

  build-artifacts:
    name: Build package and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0

      - name: Build Python distributions
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Build container image without publishing
        run: docker build --tag amberclaw/ci:${{ github.sha }} --file deploy/docker/Dockerfile .
