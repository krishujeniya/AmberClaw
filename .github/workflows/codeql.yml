name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
      with:
        category: "/language:${{matrix.language}}"
