name: Deploy AmberClaw Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'assets/LogoAC.png'
      - '.github/workflows/pages-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage logo and static documentation
        run: |
          set -euo pipefail
          test -s docs-site/index.html
          test -s assets/LogoAC.png
          cp assets/LogoAC.png docs-site/logo.png
          touch docs-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
