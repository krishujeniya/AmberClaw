name: Security Scan & Supply Chain

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run Bandit (Code Scanning)
        run: uv run bandit -r src/ -lll

      - name: Secret scan (Gitleaks v8.30.1, redacted)
        env:
          GOBIN: ${{ runner.temp }}/amberclaw-tools
          GOSUMDB: sum.golang.org
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --redact=100 --no-banner

      - name: Verify No Unsafe Deserialization (Bandit B301, B302)
        run: uv run bandit -r src/ -t B301,B302

      - name: Check installed public dependencies (pip-audit)
        run: |
          uv pip freeze --exclude-editable > installed-public-requirements.txt
          uv run pip-audit --requirement installed-public-requirements.txt --no-deps --disable-pip --strict --progress-spinner off

      - name: License Policy Compliance Check
        run: uv run python scripts/check_licenses.py

      - name: Entropy & Git History Secret Scan
        run: uv run amberclaw scan-secrets --entropy --git-history

      - name: Generate CycloneDX and SPDX SBOMs
        run: uv run python scripts/generate_sbom.py --out-dir dist

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: amberclaw-sboms
          path: dist/amberclaw.*.json
