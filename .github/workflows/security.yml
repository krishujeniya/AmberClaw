name: Security Scan & Supply Chain

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        continue-on-error: true

      - name: Fallback install uv via pip if CDN 504
        run: |
          if ! command -v uv &> /dev/null; then
            pip install uv
          fi

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run Bandit (Code Scanning)
        run: uv run bandit -r src/ -lll

      - name: Secret scan (Gitleaks v8.30.1, redacted)
        env:
          GOBIN: ${{ runner.temp }}/amberclaw-tools
          GOSUMDB: sum.golang.org
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --config=.gitleaks.toml --redact=100 --no-banner -v

      - name: Verify No Unsafe Deserialization (Bandit B301, B302)
        run: uv run bandit -r src/ -t B301,B302

      - name: Check installed public dependencies (pip-audit)
        continue-on-error: true
        run: |
          uv pip freeze --exclude-editable > installed-public-requirements.txt
          uv run pip-audit --requirement installed-public-requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: License Policy Compliance Check
        run: uv run python scripts/check_licenses.py

      - name: Entropy & Git History Secret Scan
        run: uv run amberclaw scan-secrets --entropy --git-history

      - name: Generate CycloneDX and SPDX SBOMs
        run: uv run python scripts/generate_sbom.py --out-dir dist

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amberclaw-sboms
          path: dist/amberclaw.*.json
