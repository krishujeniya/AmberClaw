regexTarget = "secret"
regexes = ["(?s)^\\-\\-\\-\\-\\-BEGIN\\ RSA\\ PRIVATE\\ KEY\\-\\-\\-\\-\\-\\\\n\"\\n\\ \\ \\ \\ \\ \\ \\ \\ \"MIIEowIBAAKCAQEA0G\\.\\.\\.rest\\ of\\ private\\ key\\.\\.\\.\\\\n\"\\n\\ \\ \\ \\ \\ \\ \\ \\ \"\\-\\-\\-\\-\\-END\\ RSA\\ PRIVATE\\ KEY\\-\\-\\-\\-\\-$"]

[[rules.allowlists]]
