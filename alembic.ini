# A generic, single database configuration for AmberClaw.

[alembic]
# Path to migration scripts
script_location = src/amberclaw/database/migrations
path_separator = os

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py file to be detected
# sourceless = false

# Version location specification; This defaults to src/amberclaw/database/migrations/versions.
version_locations = src/amberclaw/database/migrations/versions

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = sqlite:///./data/amberclaw.db


[post_write_hooks]
# Post write hooks define scripts or Python methods that are run on newly
# generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
