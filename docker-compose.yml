services:
  amberclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amberclaw_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - AMBERCLAW_HOST=0.0.0.0
      - AMBERCLAW_PORT=8000
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - amberclaw_data:/app/data
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - amberclaw-net

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: amberclaw_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - amberclaw-net

volumes:
  amberclaw_data:
  chroma_data:

networks:
  amberclaw-net:
    driver: bridge
