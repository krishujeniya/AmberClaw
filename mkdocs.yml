site_name: AmberClaw AI OS Documentation
site_description: Zero-Trust Open Agent Runtime for Private, Auditable AI Automation
site_url: https://amberclaw.ai
repo_url: https://github.com/krishujeniya/AmberClaw
repo_name: krishujeniya/AmberClaw

docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
    primary: deep orange
    accent: amber
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.indexes
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart & Setup: setup.md
    - Windows Setup: windows-setup.md
    - Local Deployment: LOCAL.md
  - Architecture & Security:
    - Zero-Trust Architecture: architecture.md
    - Enterprise SSO: sso.md
    - Architecture Decisions:
      - Overview: adr/README.md
      - ADR-0001 Bus Runtime Adapter: adr/0001-reuse-bus-runtime-for-orchestrator.md
      - ADR-0002 Dashboard Service Bindings: adr/0002-private-dashboard-service-bindings.md
      - ADR-0003 SSO Verification: adr/0003-verify-sso-before-issuing-access-tokens.md
      - ADR-0004 Token Secrets & Credentials: adr/0004-require-explicit-token-secrets-and-admin-credentials.md
  - Guides:
    - Stabilization Upgrade & Rollback: upgrade-stabilization.md
    - Unreleased Stabilization Notes: release-notes-stabilization.md
    - Building Agent Skills: skills.md
    - Troubleshooting: troubleshooting.md
    - Ecosystem Comparisons: comparisons.md
  - Runbooks:
    - SLO Breach Response: runbooks/slo_breach_runbook.md
    - Provider Outage Failover: runbooks/provider_outage_failover.md
    - Disaster Recovery & Backup: runbooks/disaster_recovery_runbook.md
  - API Reference: api.md
